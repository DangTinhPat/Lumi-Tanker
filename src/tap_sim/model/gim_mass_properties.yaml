# User-supplied mass allocation for ROBOT (GIM6010-8).STEP.
# STEP stores the CAD geometry here; these physical masses live alongside it.
robot: GIM6010-8
source_cad: ROBOT (GIM6010-8).STEP
mass_unit: kg

rigid_groups:
  body:
    mass: 2.4
    mass_breakdown_kg:
      body_frame_and_mounts: 0.278
      four_GIM6010_8_motors: 1.600
      battery: 0.210
      pcb_screws_wiring_residual: 0.312
    includes:
      - body enclosure/frame
      - battery
      - four hip/knee motors
      - PCB
      - screws and wiring
    enclosure_contents:
      - body shell
      - four GIM6010-8 motors
      - battery
      - PCB
    basis: >-
      User estimate: 278 g body + 210 g battery + 1600 g four GIM motors =
      2088 g; screws, wiring and PCB bring the estimate to about 2400 g.
      Use the unrounded estimate of 2400 g for the body assembly.
  thigh_each:
    mass: 0.05
    basis: user-specified
  shin_tube_each:
    mass: 0.04
    basis: user-specified
  wheel_motor_each:
    mass: 0.20
    basis: user-specified
  wheel_each:
    mass: 0.02
    basis: inferred from the previously accepted 0.22 kg wheel-plus-motor lump

derived:
  total_robot_mass: 3.02
  wheel_plus_motor_each: 0.22

dissipation:
  wheel_ground:
    sliding_friction_coefficient: 0.8
    basis: user-specified; identical in both tangential directions
    static_dynamic_split: not supplied; one Coulomb coefficient
  hip_knee_each:
    coulomb_friction_torque_nm: 0.1
    viscous_damping_nm_s_per_rad: 0.0
    basis: user-specified dry friction; no additional guessed viscous term

joint_motion:
  cad_frame:
    origin: center of STEP assembly bounding box
    source_origin_mm: [1370.7624, 648.5787, 964.1983]
    length_unit: m
    side_assignment: left is +Y; right is -Y
  axis_convention: +Y on both sides
  thigh_joint:
    type: continuous_revolute
    mechanical_range: full_rotation
    basis: user-specified
    left_axis_position_m: [0.0, 0.1025, 0.00828]
    right_axis_position_m: [0.0, -0.1025, 0.00828]
    axis_direction: [0.0, 1.0, 0.0]
    axis_evidence: coaxial hip plates, bearings and motor shafts
  knee_joint:
    type: revolute
    relative_link_angle_deg:
      lower: 22
      upper: 135
    reference: lower leg angle relative to the thigh horizontal
    basis: user-specified
    left_axis_position_m: [-0.09816, 0.1130, -0.01080]
    right_axis_position_m: [-0.09816, -0.1130, -0.01080]
    axis_direction: [0.0, 1.0, 0.0]
    axis_evidence: mating knee pivot bores; hip-to-knee center distance is 0.1000 m
    cad_neutral_internal_angle_deg: 22.0
    joint_coordinate_rad_at_cad_neutral: 0.0
    joint_coordinate_range_rad: [0.0, 1.97222]
    positive_rotation_increases_internal_angle: true
    encoder_zero_mapping: pending
  wheel_joint:
    type: continuous_revolute
    left_axis_position_m: [0.0, 0.1327, -0.02988]
    right_axis_position_m: [0.0, -0.1327, -0.02988]
    axis_direction: [0.0, 1.0, 0.0]
    axis_evidence: wheel and wheel-motor cylindrical surfaces
  motor_shafts:
    GIM6010_8:
      occurrences: 4
      common_axis_point_m: [0.0, 0.0, 0.00828]
      axis_direction: [0.0, 1.0, 0.0]
      note: all four shaft geometries are coaxial in the STEP assembly
    wheel_motor:
      occurrences: 2
      common_axis_point_m: [0.0, 0.0, -0.02988]
      axis_direction: [0.0, 1.0, 0.0]
    joint_drive_mapping: not encoded as kinematic mates in this STEP

cad_derived_geometry:
  wheel_center_spacing_m: 0.2654
  wheel_radius_m: 0.040
  link_center_distance_hip_to_knee_m: 0.1000
  link_center_distance_knee_to_wheel_m: 0.1000
  status: measured from STEP cylinder axes and wheel geometry
  contract_note: >-
    STEP wheel centers are 0.2654 m apart, while the existing project contract
    states 0.309 m. Keep both recorded; resolve before using track-dependent
    dynamics or wheel odometry.

inertial_properties:
  status: module estimates from the STL meshes of the CAD components (unit-density solids, scipy-free numpy script) using user-assigned group masses; the earlier BREP-based values were Iyy 0.00483, Ixz +1.8e-5
  cad_frame: centered at the STEP assembly bounding box; +X forward, +Y left, +Z up
  body:
    mass_kg: 2.4
    com_m: [-0.00509108, 0.00012802, 0.01378601]
    iyy_kg_m2: 0.004309762
    diagonal_inertia_about_com_kg_m2: [0.008501529, 0.004309762, 0.009300323]
    full_inertia_about_com_kg_m2:
      - [0.008501529, -0.000016739, -0.000150363]
      - [-0.000016739, 0.004309762, 0.000004467]
      - [-0.000150363, 0.000004467, 0.009300323]
    module_masses_kg:
      body_frame_and_fixed_mounts: 0.278
      each_GIM6010_8: 0.400
      battery: 0.210
      PCB_fasteners_wiring_residual: 0.312
    module_counts:
      GIM6010_8: 4
    mass_allocation_method: >-
      GIM motor, battery and body-frame group masses are assigned to their STEP
      component geometry. The 278 g frame group is volume-weighted across fixed
      structural/support components; the 312 g PCB/fastener/wiring residual is
      volume-weighted across the PCB and CAD fasteners because wiring geometry
      and its separate mass are unavailable. Component BREP volume inertias use
      uniform density within each group. The assigned module masses sum to the
      2.40 kg body estimate; no rounding mass is added at the aggregate COM.
    note: >-
      Module inertials are combined into one rigid-body inertial because these
      modules do not move relative to the body. This is dynamically equivalent
      to separate welded modules. Iyy is the body pitch inertia about its COM.
  thigh_each:
    mass_kg: 0.05
    com_from_hip_m: [-0.04908, 0.0, -0.00954]
    iyy_about_com_kg_m2: 0.0000417
    diagonal_inertia_about_com_kg_m2: [0.000420, 0.0000417, 0.000420]
    basis: uniform slender link along the 100 mm hip-to-knee CAD vector
  shin_and_wheel_motor_each:
    mass_kg: 0.24
    com_from_knee_m: [0.08998, 0.0, -0.01749]
    iyy_about_com_kg_m2: 0.000220
    diagonal_inertia_about_com_kg_m2: [0.001, 0.000220, 0.001]
    basis: 40 g tube midpoint plus 200 g motor at wheel-axis center
  wheel_each:
    mass_kg: 0.02
    com_from_wheel_axis_m: [0.0, 0.0, 0.0]
    iyy_about_com_kg_m2: 0.000016
    diagonal_inertia_about_com_kg_m2: [0.000008, 0.000016, 0.000008]
    basis: uniform solid disc, 40 mm radius, rotating about +Y
  cautions:
    - STEP does not contain rigid-body inertial properties or joint mates.
    - Wheel-motor stator is grouped with the shin; only the 20 g wheel rotates.
    - Wheel-center spacing from STEP is 0.2654 m; the old 0.309 m contract is unresolved.
    - Do not treat these estimated inertias or the simulator as hardware calibration.
  cad_neutral_whole_robot:
    com_relative_to_wheel_axle_m: [-0.00697119, 0.0, 0.03590186]
    com_height_above_ground_m: 0.07590186
    pitch_inertia_about_axle_kg_m2: 0.00985962
    effective_pendulum_length_m: 0.08927000
    basis: rigid-group estimates above, symmetric two-leg CAD-zero pose
