# Experimental native-CAD symmetric squat/standup profile; not calibrated
# encoder limits. Layered over balance_controller.yaml by sim.launch.py. Keep
# torque, sensor watchdog and fall limits unchanged. See docs/DEEP_SQUAT.md
# for the tested crouch scope. pose_knee_max_rad raised from the normal 0.2
# to 0.5 for the Standup GUI button/mode (tap_teleop.deep_squat.
# generate_stand_tall) - FK height rises monotonically from neutral (knee=0)
# to knee~=0.57 rad then folds back down, so 0.5 stays inside that region
# with margin. This has not had DEEP_SQUAT.md's full CAD mesh-collision
# audit (that audit only covers the crouch direction); the small magnitude
# and generate_stand_tall's own monotonicity/support-envelope checks are the
# current safety net for this direction, not a hardware travel-limit claim.
balance_controller_node:
  ros__parameters:
    pose_hip_max_rad: 1.05
    pose_knee_min_rad: -1.6
    pose_knee_max_rad: 0.5
    mpc:
      min_pendulum_length: 0.125
    station_keeper:
      enabled: true
      position_gain_hz: 0.8
      yaw_gain_hz: 2.0
      max_forward_m_s: 0.08
      max_yaw_rad_s: 0.25
