# Ascento-style (arXiv 2005.11435) torque-threshold contact confirmation,
# tested in isolation from the earlier (measured-harmful, see
# landing_recovery_test.yaml) landing-window/LandingReflex mechanisms - this
# overlay enables ONLY the torque_touchdown_* signal improvement, nothing
# else, so an A/B result against stock isolates this one change.
balance_controller_node:
  ros__parameters:
    torque_touchdown_enabled: true
    hip_touchdown_torque_nm: 2.5
    hip_touchdown_max_velocity_rad_s: 1.0
