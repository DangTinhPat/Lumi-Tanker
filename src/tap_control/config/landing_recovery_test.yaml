# Landing-recovery boost tuning for tools/landing_ledge_smoke.py's and
# tools/clean_ledge_smoke.py's empirical baseline-vs-enabled A/B comparisons
# (see those tools' module docstrings). NOT a validated default profile -
# every landing_* term defaults to 0 in balance_controller.yaml itself (see
# MpcBalancer::Config), so this overlay is what actually turns the features
# on for a trial. Layered over balance_controller.yaml via controller_config:=.
#
# MEASURED REGRESSION, do not promote this to a default without re-tuning:
# on the isolated clean ledge (tools/clean_ledge_smoke.py, terrain:=ledge,
# 1.0 m/s, 20 cm drop, n=10 each), this combined config recovered 4/10 (40%)
# versus the stock controller's 7/10 (70%) - i.e. every term enabled here
# together made the real, unconfounded landing test WORSE, not better. Which
# individual term is responsible has not been isolated. See
# docs/LEDGE_DRIVEOFF_LIMIT.md for the full evidence and current
# recommendation (stock config, no overlay, is presently the best known
# option for this scenario).
balance_controller_node:
  ros__parameters:
    # Nonzero only so the newly-wired kd_scale term in publishLegCommand() has
    # something to multiply; kd_scale itself stays 0 outside the landing
    # window (see landing_kd_boost), so this alone changes nothing.
    leg_kd: 0.6
    mpc.leg_kd_scale: 0.0
    mpc.landing_window_s: 0.3
    mpc.landing_kp_boost: 0.5
    mpc.landing_kd_boost: 1.0
    mpc.landing_ground_accel_boost_m_s2: 6.0
    # New reactive mechanism (this session): an actual leg-TARGET offset on
    # airborne/touchdown, not a stiffness change (see LandingReflex.hpp and
    # docs/LEDGE_DRIVEOFF_LIMIT.md). Pre-crouch both knees by 0.4 rad the
    # instant floor_contact goes false (well within pose_knee_min_rad=-0.8),
    # hold through a 0.15 s post-touchdown catch window, then blend back to
    # the commanded pose over 0.3 s so the extension-back-out happens as an
    # actual commanded trajectory during the impact, not an instant snap.
    # hip_offset_per_pitch_rate stays 0 here: its sign has not been validated
    # against a real drive-off trial yet (see LandingReflex.hpp comment).
    landing_reflex.airborne_knee_crouch_rad: 0.4
    landing_reflex.hip_offset_per_pitch_rate: 0.0
    landing_reflex.catch_hold_s: 0.15
    landing_reflex.catch_blend_s: 0.3
