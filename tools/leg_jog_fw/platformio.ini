; Bench leg-jog firmware (DRAFT) - drives the 4 GDS68 leg joints together from
; tools/leg_jog_gui.py. Separate from the robot firmware in firmware/esp32/.
;
;   pio run -d tools/leg_jog_fw -t upload --upload-port /dev/ttyUSB1
;   python3 tools/leg_jog_gui.py
;
; Reflash the robot firmware afterwards:
;   pio run -e esp32-s3-v3 -t upload --upload-port /dev/ttyUSB1

[platformio]
default_envs = leg-jog

[env:leg-jog]
; Same proven profile as firmware/esp32 (custom ESP32-S3 N16R8 PCB).
platform = platformio/espressif32@7.1.3
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_protocol = esptool
build_flags =
    ; Serial stays on UART0 (GPIO43/44 -> CP2102), not the native USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    ; Shared MIT codec and the verified node/sign table.
    -I../../controller/hal/include
    -std=gnu++17
build_unflags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++11
    -std=c++11
