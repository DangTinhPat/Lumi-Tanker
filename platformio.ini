[platformio]
default_envs = esp32-s3-poc
src_dir = firmware_esp32/src
include_dir = firmware_esp32/include

[env:esp32-s3-poc]
platform = platformio/espressif32@7.1.3
; Closest built-in profile for the custom ESP32-S3-WROOM-1 N16R8 PCB.
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

; Custom PCB: ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM).
; Bring-up: the octal PSRAM did not initialise on the first board, so the
; quad memory profile is used and PSRAM is not requested (firmware needs ~45 KB).
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
extra_scripts = pre:firmware_esp32/extra_script.py

; Reuse the portable controller and firmware boundary without copying them.
lib_deps =
    stempedia/DabbleESP32@1.5.1

build_flags =
    ; Serial must stay on UART0 (GPIO43/44 -> CP2102), not the native USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Isrc_fw/include
    -Isrc/tap_control/core/include
    -Isrc/tap_control/hal/include
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++11
    -std=c++11

; Startup keeps actuator enable locked until wheel direction/scale and IMU
; frame confirmations are checked in BoardConfig.
; Disabled frames and zero-gain CAN/UART feedback polls are still transmitted.
upload_protocol = esptool
