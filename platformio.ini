[platformio]
default_envs = esp32-s3-v3
src_dir = firmware_esp32/src
include_dir = firmware_esp32/include

; Firmware v3: two-wheel inverted pendulum. Legs locked at the power-up pose
; (GDS68 position mode), wheels balance, USB serial GUI only. See
; src_fw/FIRMWARE_V3.md.
[env:esp32-s3-v3]
platform = platformio/espressif32@7.1.3
; Closest built-in profile for the custom ESP32-S3-WROOM-1 N16R8 PCB.
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

; Custom PCB: ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM).
; Bring-up: the octal PSRAM did not initialise on the first board, so the
; quad memory profile is used and PSRAM is not requested (firmware needs ~45 KB).
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
extra_scripts = pre:firmware_esp32/extra_script.py

; Reuse the portable controller and firmware boundary without copying them.
lib_deps =
    stempedia/DabbleESP32@1.5.1

build_flags =
    ; Serial must stay on UART0 (GPIO43/44 -> CP2102), not the native USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Isrc_fw/include
    -Isrc/tap_control/core/include
    -Isrc/tap_control/hal/include
    -DCORE_DEBUG_LEVEL=1
    ; The 500 Hz balance loop measured ~1.85 ms/2 ms at the default -Os.
    -O2
    ; Per-tick control code in internal RAM (robot_control/HotPath.hpp): no instruction-cache refills from flash.
    -DTAP_HOT_IRAM=1
    ; Wi-Fi console (AP TAP-RB, TCP 8023); turns the Bluedroid gamepad off. Remove to get BLE back.
    -DTAP_WIFI=1
    -DTAP_WHEEL_CORE=1
    -DTAP_WHEEL_PRIO=22
    -std=gnu++17
build_unflags =
    -Os
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++11
    -std=c++11

upload_protocol = esptool

; v3 with the old single Arduino loop (no FreeRTOS control task) - the
; fallback if the task split misbehaves on the robot.
[env:esp32-s3-v3-single-loop]
extends = env:esp32-s3-v3
build_flags =
    ${env:esp32-s3-v3.build_flags}
    -DTAP_V3_SINGLE_LOOP=1
